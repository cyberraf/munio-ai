services:
  # ── Databases ────────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-asb_prod}
    volumes:
      - ../init/clickhouse:/docker-entrypoint-initdb.d
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asb}
      POSTGRES_USER: ${POSTGRES_USER:-asb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../init/postgres:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Backend ──────────────────────────────────────────────────────────────────
  asb-core:
    build:
      context: ../services/core
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      CLICKHOUSE_URL: "clickhouse://default:${CLICKHOUSE_PASSWORD:-asb_prod}@clickhouse:9000?database=default"
      POSTGRES_URL: "postgres://${POSTGRES_USER:-asb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asb}?sslmode=disable"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ROBOT_API_KEY: ${ROBOT_API_KEY}
    depends_on:
      - clickhouse
      - postgres
    restart: unless-stopped

  # ── Dashboard ────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ../web/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api"
        NEXT_PUBLIC_WS_URL: "wss://${DOMAIN}"
    environment:
      NODE_ENV: production
    depends_on:
      - asb-core
    restart: unless-stopped

  # ── Reverse Proxy (auto-SSL) ─────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - asb-core
      - dashboard
    restart: unless-stopped

  # ── Mock Agents (demo data) ──────────────────────────────────────────────────
  locus-connector:
    build:
      context: ../agent
      dockerfile: Dockerfile
    command: >
      python3 locus_connector.py --mock
        --url ws://asb-core:8080/ws/telemetry?key=${ROBOT_API_KEY}
        --facility-id warehouse-001
        --robot-count 3
    depends_on:
      - asb-core
    restart: unless-stopped

  picar-mock:
    build:
      context: ../agent
      dockerfile: Dockerfile
    command: >
      python3 picar_telemetry_agent.py --mock
        --url ws://asb-core:8080/ws/telemetry?key=${ROBOT_API_KEY}
        --robot-id picar-1
    depends_on:
      - asb-core
    restart: unless-stopped

  turtlebot-mock:
    build:
      context: ../agent
      dockerfile: Dockerfile
    command: >
      python3 ros2_connector.py --mock
        --url ws://asb-core:8080/ws/telemetry?key=${ROBOT_API_KEY}
        --robot-id turtlebot-001
        --facility-id lab-001
    depends_on:
      - asb-core
    restart: unless-stopped

volumes:
  clickhouse_data:
  postgres_data:
  caddy_data:
  caddy_config:
